name: Build

# Builds and tests the latest Claude Code release without publishing anything: the images
# contain Anthropic's code, which is not redistributed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build test images
        run: |
          version=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          for platform in linux/amd64 linux/arm/v7; do
            docker buildx build --platform "$platform" --load -t "claude-test:${platform##*/}" \
              --build-arg CLAUDE_VERSION="$version" \
              --cache-from "type=gha,scope=$platform" --cache-to "type=gha,mode=max,scope=$platform" .
          done

      # The armv7 image runs the Node rebuild, which must behave like the official binary.
      - name: Test
        timeout-minutes: 20
        run: |
          sudo apt-get install -y tmux
          test/compare.sh claude-test:amd64 claude-test:v7
