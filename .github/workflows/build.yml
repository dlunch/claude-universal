name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the latest Claude Code version
        id: version
        run: |
          version=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Scheduled runs only build versions that have not been published yet.
          if [ "${{ github.event_name }}" = schedule ] \
            && docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "Image for $version already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.version.outputs.skip != 'true'

      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.version.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: CLAUDE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
